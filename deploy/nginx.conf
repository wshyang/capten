server {
    listen       3000;
    listen  [::]:3000;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Enable gzip compression for static assets and checkpoints
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_proxied any;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check endpoint for UAT & Prod load balancers / Kubernetes liveness probes
    location /healthz {
        access_log off;
        return 200 "OK\n";
    }

    # Cache static assets cleanly
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Serve checkpoint weights with CORS headers for client-side TF.js loading
    location /checkpoints/ {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA routing fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
